name: Build Windows-Installer

# Baut die eigenständige Windows-.exe (PyInstaller) und einen Inno-Setup-
# Installer auf einem echten Windows-Runner. Die fertigen Dateien werden als
# herunterladbare Artefakte bereitgestellt – ganz ohne lokale Python-Umgebung.

on:
  push:
    branches:
      - "claude/windows-ollama-rss-app-j0eyxw"
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kernlogik-Tests ausführen
        run: python tests/test_core.py

      - name: EXE mit PyInstaller bauen
        run: pyinstaller packaging/rss_rechercheur.spec --noconfirm

      - name: Inno Setup installieren
        run: choco install innosetup --no-progress -y

      - name: Installer bauen
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - name: Artefakt – portable App (One-Folder)
        uses: actions/upload-artifact@v4
        with:
          name: RSS-Rechercheur-portable
          path: dist/RSS-Rechercheur/

      - name: Artefakt – Setup-Installer
        uses: actions/upload-artifact@v4
        with:
          name: RSS-Rechercheur-Setup
          path: packaging/installer_output/*.exe

      - name: Release veröffentlichen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/installer_output/*.exe
