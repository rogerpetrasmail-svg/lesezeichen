<!DOCTYPE html>
<!-- =====================================================================
     SCATTER 1 · "CROSSHAIR DOTS"
     Punktwolke, jeder Punkt als kleines Fadenkreuz. Statisch: Punkte
     ploppen einmalig gestaffelt ein.
     ===================================================================== -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Scatter · Crosshair Dots</title>
<link rel="stylesheet" href="../shared/obs-core.css">
<style>
  .axis  { stroke: var(--c-grid); stroke-width: 1; }
  .ch    { opacity: 0; animation: pop calc(.45s / var(--speed)) ease-out forwards; transform-box: fill-box; transform-origin: center; }
  @keyframes pop { 0% { opacity:0; transform: scale(2.4); } 100% { opacity:1; transform: scale(1); } }
  .ch line { stroke: var(--c-primary); stroke-width: var(--line-width); }
  .ch circle { fill: var(--c-accent); }
</style>
</head>
<body>
  <div class="obs-module">
    <div class="tech-frame"><span class="corner-tr"></span><span class="corner-bl"></span></div>
    <div class="module-title" id="title">CROSSHAIR DOTS</div>
    <svg class="viz" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet">
      <g id="axis"></g>
      <g id="dots"></g>
    </svg>
    <div class="module-sub" id="sub">SCATTER</div>
  </div>

<script src="../shared/obs-core.js"></script>
<script>
(function () {
  var M = { l: 30, r: 20, t: 24, b: 28 }, W = 400, H = 260;
  var px0 = M.l, px1 = W - M.r, py0 = H - M.b, py1 = M.t;

  function render(data) {
    var s = (data.series && data.series.scatter) || { points: [] };
    var pts = s.points || [];
    document.getElementById("title").textContent = s.label || "CROSSHAIR DOTS";

    var ex = OBS.extent(pts, function (d) { return d.x; });
    var ey = OBS.extent(pts, function (d) { return d.y; });
    var xs = OBS.scale(ex[0], ex[1] || 1, px0, px1);
    var ys = OBS.scale(ey[0], ey[1] || 1, py0, py1);

    var ax = document.getElementById("axis");
    for (var k = 0; k <= 4; k++) {
      OBS.el("line", { class: "axis", x1: px0, y1: py1 + (py0 - py1) * k / 4, x2: px1, y2: py1 + (py0 - py1) * k / 4 }, ax);
      OBS.el("line", { class: "axis", x1: px0 + (px1 - px0) * k / 4, y1: py1, x2: px0 + (px1 - px0) * k / 4, y2: py0 }, ax);
    }

    var g = document.getElementById("dots");
    pts.forEach(function (p, i) {
      var x = xs(p.x), y = ys(p.y);
      var grp = OBS.el("g", { class: "ch" }, g);
      grp.style.animationDelay = (i * 0.05) + "s";
      OBS.el("line", { x1: x - 6, y1: y, x2: x + 6, y2: y }, grp);
      OBS.el("line", { x1: x, y1: y - 6, x2: x, y2: y + 6 }, grp);
      OBS.el("circle", { cx: x, cy: y, r: 2.2 }, grp);
    });
  }
  OBS.loadData().then(render);
})();
</script>
</body>
</html>
