<!DOCTYPE html>
<!-- =====================================================================
     COMBO 1 · "TREND ANALYZER"  (Verbund, Multi-Serien)
     Erste Datenreihe (Var 1) = Balken (Volumen), jede weitere Reihe
     (Var 2, Var 3 ...) = überlagerte Trend-Linie. Gemeinsame Y-Skala.
     Balken steigen, Linien zeichnen sich einmalig.
     ===================================================================== -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Combo · Trend Analyzer</title>
<link rel="stylesheet" href="../shared/obs-core.css">
<style>
  .axis  { stroke: var(--c-grid); stroke-width: 1; }
  .bar   { transform-origin: bottom; animation: rise-in calc(.9s / var(--speed)) ease-out forwards; }
  .trend { fill: none; stroke-width: var(--line-width); filter: drop-shadow(0 0 var(--glow) var(--c-accent));
           stroke-dasharray: var(--len); stroke-dashoffset: var(--len);
           animation: draw-in calc(1.6s / var(--speed)) ease-out forwards; }
  .node  { opacity: 0; animation: fade-in .4s ease forwards; }
  .blabel{ fill: var(--c-text); font-size: 10px; text-anchor: middle; opacity: .85; }
  .lg-txt{ fill: var(--c-text); font-size: 10px; }
</style>
</head>
<body>
  <div class="obs-module">
    <div class="tech-frame"><span class="corner-tr"></span><span class="corner-bl"></span></div>
    <div class="module-title" id="title">TREND ANALYZER</div>
    <svg class="viz" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet">
      <g id="axis"></g>
      <g id="bars"></g>
      <g id="lines"></g>
      <g id="nodes"></g>
      <g id="labels"></g>
      <g id="legend"></g>
    </svg>
    <div class="module-sub" id="sub">COMBO</div>
  </div>

<script src="../shared/obs-core.js"></script>
<script>
(function () {
  var M = { l: 30, r: 20, t: 26, b: 32 }, W = 400, H = 260;
  var px0 = M.l, px1 = W - M.r, py0 = H - M.b, py1 = M.t;

  function render(sheet) {
    document.getElementById("title").textContent = sheet.name || "TREND ANALYZER";
    var n = sheet.labels.length || 1;
    var ys = OBS.scale(0, sheet.max || 1, py0, py1);   // gemeinsame Skala
    var slot = (px1 - px0) / n, bw = slot * 0.5;
    var cx = function (i) { return px0 + slot * i + slot / 2; };

    OBS.el("line", { class: "axis", x1: px0, y1: py0, x2: px1, y2: py0 }, document.getElementById("axis"));

    var bars = document.getElementById("bars"), lines = document.getElementById("lines"),
        nodes = document.getElementById("nodes"), labels = document.getElementById("labels"),
        lg = document.getElementById("legend");

    sheet.series.forEach(function (se, si) {
      var st = OBS.seriesStyle(si);
      if (si === 0) {
        // erste Reihe als Balken
        se.values.forEach(function (v, i) {
          var bar = OBS.el("rect", { class: "bar", x: cx(i) - bw / 2, y: ys(v), width: bw, height: py0 - ys(v),
            rx: 2, fill: st.color, opacity: 0.55 }, bars);
          bar.style.animationDelay = (i * 0.06) + "s";
        });
      } else {
        // weitere Reihen als Trend-Linien
        var d = se.values.map(function (v, i) { return (i ? "L" : "M") + cx(i) + " " + ys(v); }).join(" ");
        var line = OBS.el("path", { class: "trend", d: d, stroke: st.color,
          "stroke-dasharray": st.dash === "none" ? "" : st.dash, opacity: st.opacity }, lines);
        line.style.setProperty("--len", OBS.pathLen(line));
        line.style.animationDelay = (0.4 + si * 0.15) + "s";
        se.values.forEach(function (v, i) {
          var c = OBS.el("circle", { class: "node", cx: cx(i), cy: ys(v), r: 2.6, fill: st.color }, nodes);
          c.style.animationDelay = (0.9 + i * 0.07) + "s";
        });
      }
      OBS.el("rect", { x: px1 - 70, y: py1 - 14 + si * 13, width: 9, height: 9, rx: 2, fill: st.color, opacity: st.opacity }, lg);
      OBS.el("text", { class: "lg-txt", x: px1 - 57, y: py1 - 6 + si * 13 }, lg).textContent =
        se.name + (si === 0 ? " (Balken)" : "");
    });

    sheet.labels.forEach(function (lab, i) {
      if (n > 8 && i % 2) return;
      OBS.el("text", { class: "blabel", x: cx(i), y: py0 + 14 }, labels).textContent = lab;
    });
  }
  OBS.loadData().then(function (data) { render(OBS.normalizeSheet(data)); });
})();
</script>
</body>
</html>
