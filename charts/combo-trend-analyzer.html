<!DOCTYPE html>
<!-- =====================================================================
     COMBO 1 · "TREND ANALYZER"
     Verbunddiagramm: Balken (Volumen) + überlagerte Trend-Linie.
     Statisch: Balken steigen, Linie zeichnet sich einmalig.
     ===================================================================== -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Combo · Trend Analyzer</title>
<link rel="stylesheet" href="../shared/obs-core.css">
<style>
  .axis    { stroke: var(--c-grid); stroke-width: 1; }
  .bar     { fill: var(--c-primary); fill-opacity: .55;
             transform-origin: bottom; animation: rise-in calc(.9s / var(--speed)) ease-out forwards; }
  .trend   { stroke: var(--c-accent); stroke-width: var(--line-width); fill: none;
             filter: drop-shadow(0 0 var(--glow) var(--c-accent));
             stroke-dasharray: var(--len); stroke-dashoffset: var(--len);
             animation: draw-in calc(1.6s / var(--speed)) ease-out forwards; animation-delay:.5s; }
  .node    { fill: var(--c-accent); opacity: 0; animation: fade-in .4s ease forwards; }
  .blabel  { fill: var(--c-text); font-size: 11px; text-anchor: middle; opacity:.85; }
</style>
</head>
<body>
  <div class="obs-module">
    <div class="tech-frame"><span class="corner-tr"></span><span class="corner-bl"></span></div>
    <div class="module-title" id="title">TREND ANALYZER</div>
    <svg class="viz" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet">
      <g id="axis"></g>
      <g id="bars"></g>
      <path class="trend" id="trend"/>
      <g id="nodes"></g>
      <g id="labels"></g>
    </svg>
    <div class="module-sub" id="sub">COMBO</div>
  </div>

<script src="../shared/obs-core.js"></script>
<script>
(function () {
  var M = { l: 30, r: 20, t: 24, b: 32 }, W = 400, H = 260;
  var px0 = M.l, px1 = W - M.r, py0 = H - M.b, py1 = M.t;

  function render(data) {
    var s = (data.series && data.series.combo) || { points: [] };
    var pts = s.points || [];
    document.getElementById("title").textContent = s.label || "TREND ANALYZER";

    var maxBar = OBS.extent(pts, function (d) { return d.bar; })[1] || 1;
    var maxLine = OBS.extent(pts, function (d) { return d.line; })[1] || 1;
    var ysBar = OBS.scale(0, maxBar, py0, py1);
    var ysLine = OBS.scale(0, maxLine, py0, py1);
    var n = pts.length, slot = (px1 - px0) / n, bw = slot * 0.5;

    OBS.el("line", { class: "axis", x1: px0, y1: py0, x2: px1, y2: py0 }, document.getElementById("axis"));

    var bars = document.getElementById("bars"), labels = document.getElementById("labels");
    pts.forEach(function (p, i) {
      var x = px0 + slot * i + (slot - bw) / 2;
      var bar = OBS.el("rect", { class: "bar", x: x, y: ysBar(p.bar), width: bw, height: py0 - ysBar(p.bar), rx: 2 }, bars);
      bar.style.animationDelay = (i * 0.07) + "s";
      OBS.el("text", { class: "blabel", x: px0 + slot * i + slot / 2, y: py0 + 16 }, labels).textContent = p.label;
    });

    // Trend-Linie über Balkenmitten
    var cx = function (i) { return px0 + slot * i + slot / 2; };
    var d = pts.map(function (p, i) { return (i ? "L" : "M") + cx(i) + " " + ysLine(p.line); }).join(" ");
    var trend = document.getElementById("trend");
    trend.setAttribute("d", d);
    trend.style.setProperty("--len", OBS.pathLen(trend));

    var nodes = document.getElementById("nodes");
    pts.forEach(function (p, i) {
      var c = OBS.el("circle", { class: "node", cx: cx(i), cy: ysLine(p.line), r: 3 }, nodes);
      c.style.animationDelay = (0.9 + i * 0.1) + "s";
    });
  }
  OBS.loadData().then(render);
})();
</script>
</body>
</html>
