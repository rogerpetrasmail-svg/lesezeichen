<!DOCTYPE html>
<!-- =====================================================================
     LINE 1 · "DIGITAL GRID"  (Multi-Serien-Referenz)
     ---------------------------------------------------------------------
     Liniendiagramm mit Punktraster. Liest das aktive Sheet (?sheet=) und
     zeichnet für JEDE Datenreihe (Var 1, Var 2 ...) eine eigene Linie.
       - Reihe 0  -> var(--c-primary)   (an Customizer gekoppelt)
       - Reihe 1  -> var(--c-accent)
       - Reihe 2  -> var(--c-text)
       - ab Reihe 3 -> Farben wiederholen sich mit Strich-Muster
     Y-Skala = globales Min/Max ÜBER ALLE Reihen (keine Linie bricht aus).
     Statisch fürs Video: einmalige Zeichen-In-Animation pro Linie.
     ===================================================================== -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Line · Digital Grid</title>
<link rel="stylesheet" href="../shared/obs-core.css">
<style>
  .dot-grid circle { fill: var(--c-grid); }
  .axis  { stroke: var(--c-grid); stroke-width: 1; }
  /* Linien werden per JS gefärbt; Animation hängt am globalen --speed.   */
  .series-line { fill: none; stroke-width: var(--line-width);
                 stroke-dasharray: var(--len); stroke-dashoffset: var(--len);
                 animation: draw-in calc(1.6s / var(--speed)) ease-out forwards; }
  .node  { opacity: 0; animation: fade-in .4s ease forwards; }
  .lg-txt { fill: var(--c-text); font-size: 10px; }
</style>
</head>
<body>
  <div class="obs-module">
    <div class="tech-frame"><span class="corner-tr"></span><span class="corner-bl"></span></div>
    <div class="module-title" id="title">DIGITAL GRID</div>
    <svg class="viz" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet">
      <g class="dot-grid" id="grid"></g>
      <g id="axis"></g>
      <g id="series"></g>
      <g id="nodes"></g>
      <g id="legend"></g>
    </svg>
    <div class="module-sub" id="sub">LINE</div>
  </div>

<script src="../shared/obs-core.js"></script>
<script>
(function () {
  var M = { l: 30, r: 20, t: 26, b: 28 }, W = 400, H = 260;
  var px0 = M.l, px1 = W - M.r, py0 = H - M.b, py1 = M.t;

  function render(sheet) {
    document.getElementById("title").textContent = sheet.name || "DIGITAL GRID";
    var labels = sheet.labels, n = labels.length || 1;

    // gemeinsame Skala: 0-Basis bis globales Max über ALLE Reihen
    var lo = Math.min(0, sheet.min), hi = sheet.max || 1;
    var xs = OBS.scale(0, n - 1, px0, px1);
    var ys = OBS.scale(lo, hi, py0, py1);

    // Punktraster
    var grid = document.getElementById("grid");
    for (var gx = px0; gx <= px1; gx += 18)
      for (var gy = py1; gy <= py0; gy += 18)
        OBS.el("circle", { cx: gx, cy: gy, r: 1 }, grid);

    // Achsen
    var ax = document.getElementById("axis");
    OBS.el("line", { class: "axis", x1: px0, y1: py0, x2: px1, y2: py0 }, ax);
    OBS.el("line", { class: "axis", x1: px0, y1: py1, x2: px0, y2: py0 }, ax);

    // eine Linie + Knoten je Datenreihe
    var sg = document.getElementById("series"), ng = document.getElementById("nodes");
    var lg = document.getElementById("legend");
    sheet.series.forEach(function (se, si) {
      var st = OBS.seriesStyle(si);
      var d = se.values.map(function (v, i) { return (i ? "L" : "M") + xs(i) + " " + ys(v); }).join(" ");
      var path = OBS.el("path", {
        class: "series-line", d: d,
        stroke: st.color, "stroke-dasharray": st.dash === "none" ? "" : st.dash,
        opacity: st.opacity
      }, sg);
      // Zeichen-Animation (stroke-dash) – Dash-Muster getrennt via --len
      var len = OBS.pathLen(path);
      path.style.setProperty("--len", len);
      path.style.animationDelay = (si * 0.25) + "s";

      // Knotenpunkte
      se.values.forEach(function (v, i) {
        var c = OBS.el("circle", { class: "node", cx: xs(i), cy: ys(v), r: 2.4, fill: st.color }, ng);
        c.style.opacity = 0; c.style.animationDelay = (0.6 + si * 0.25 + i * 0.06) + "s";
      });

      // Legende
      OBS.el("rect", { x: px1 - 70, y: py1 - 14 + si * 13, width: 9, height: 9, rx: 2, fill: st.color, opacity: st.opacity }, lg);
      OBS.el("text", { class: "lg-txt", x: px1 - 57, y: py1 - 6 + si * 13 }, lg).textContent = se.name;
    });

    // X-Beschriftung (erste/mittlere/letzte – Übersicht)
    [0, Math.floor(n / 2), n - 1].forEach(function (i) {
      if (labels[i] === undefined) return;
      OBS.el("text", { class: "lg-txt", x: xs(i), y: py0 + 16, "text-anchor": "middle" }, document.getElementById("axis"))
        .textContent = labels[i];
    });
  }

  OBS.loadData().then(function (data) { render(OBS.normalizeSheet(data)); });
})();
</script>
</body>
</html>
