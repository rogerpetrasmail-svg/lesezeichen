<!DOCTYPE html>
<!-- =====================================================================
     LINE 2 · "STEPPED PULSE"  (Multi-Serien)
     Stufensignal je Datenreihe. Gemeinsame Y-Skala über alle Reihen.
     ===================================================================== -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Line · Stepped Pulse</title>
<link rel="stylesheet" href="../shared/obs-core.css">
<style>
  .axis { stroke: var(--c-grid); stroke-width: 1; }
  .series-line { fill: none; stroke-width: var(--line-width); stroke-linejoin: miter;
                 stroke-dasharray: var(--len); stroke-dashoffset: var(--len);
                 animation: draw-in calc(1.8s / var(--speed)) ease-out forwards; }
  .lg-txt { fill: var(--c-text); font-size: 10px; }
</style>
</head>
<body>
  <div class="obs-module">
    <div class="tech-frame"><span class="corner-tr"></span><span class="corner-bl"></span></div>
    <div class="module-title" id="title">STEPPED PULSE</div>
    <svg class="viz" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet">
      <g id="axis"></g>
      <g id="series"></g>
      <g id="legend"></g>
    </svg>
    <div class="module-sub" id="sub">STEP</div>
  </div>

<script src="../shared/obs-core.js"></script>
<script>
(function () {
  var M = { l: 30, r: 20, t: 26, b: 28 }, W = 400, H = 260;
  var px0 = M.l, px1 = W - M.r, py0 = H - M.b, py1 = M.t;

  function render(sheet) {
    document.getElementById("title").textContent = sheet.name || "STEPPED PULSE";
    var n = sheet.labels.length || 1;
    var lo = Math.min(0, sheet.min), hi = sheet.max || 1;
    var xs = OBS.scale(0, n - 1, px0, px1);
    var ys = OBS.scale(lo, hi, py0, py1);

    var ax = document.getElementById("axis");
    for (var k = 0; k <= 4; k++) {
      var gy = py1 + (py0 - py1) * k / 4;
      OBS.el("line", { class: "axis", x1: px0, y1: gy, x2: px1, y2: gy }, ax);
    }

    var sg = document.getElementById("series"), lg = document.getElementById("legend");
    sheet.series.forEach(function (se, si) {
      var st = OBS.seriesStyle(si);
      // Stufen-Pfad: horizontal halten, dann vertikal zum nächsten Wert
      var d = "";
      se.values.forEach(function (v, i) {
        var x = xs(i), y = ys(v);
        if (i === 0) d += "M" + x + " " + y;
        else d += " L" + x + " " + ys(se.values[i - 1]) + " L" + x + " " + y;
      });
      var path = OBS.el("path", {
        class: "series-line", d: d, stroke: st.color,
        "stroke-dasharray": st.dash === "none" ? "" : st.dash, opacity: st.opacity
      }, sg);
      path.style.setProperty("--len", OBS.pathLen(path));
      path.style.animationDelay = (si * 0.25) + "s";

      OBS.el("rect", { x: px1 - 70, y: py1 - 14 + si * 13, width: 9, height: 9, rx: 2, fill: st.color, opacity: st.opacity }, lg);
      OBS.el("text", { class: "lg-txt", x: px1 - 57, y: py1 - 6 + si * 13 }, lg).textContent = se.name;
    });
  }
  OBS.loadData().then(function (data) { render(OBS.normalizeSheet(data)); });
})();
</script>
</body>
</html>
