<!DOCTYPE html>
<!-- =====================================================================
     LINE 2 · "STEPPED PULSE"
     Stufensignal (Step-Line) wie ein digitales Logik-Signal.
     Statisch: einmalige Zeichen-In-Animation.
     ===================================================================== -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Line · Stepped Pulse</title>
<link rel="stylesheet" href="../shared/obs-core.css">
<style>
  .step-line { stroke: var(--c-primary); stroke-width: var(--line-width); fill: none;
               stroke-linejoin: miter; filter: drop-shadow(0 0 var(--glow) var(--c-accent));
               stroke-dasharray: var(--len); stroke-dashoffset: var(--len);
               animation: draw-in calc(1.8s / var(--speed)) ease-out forwards; }
  .axis     { stroke: var(--c-grid); stroke-width: 1; }
  .hi-marker{ fill: var(--c-accent); opacity: 0; animation: fade-in .4s ease forwards; }
</style>
</head>
<body>
  <div class="obs-module">
    <div class="tech-frame"><span class="corner-tr"></span><span class="corner-bl"></span></div>
    <div class="module-title" id="title">STEPPED PULSE</div>
    <svg class="viz" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet">
      <g id="axis"></g>
      <path class="step-line" id="line"/>
      <g id="markers"></g>
    </svg>
    <div class="module-sub" id="sub">STEP</div>
  </div>

<script src="../shared/obs-core.js"></script>
<script>
(function () {
  var M = { l: 30, r: 20, t: 24, b: 28 }, W = 400, H = 260;
  var px0 = M.l, px1 = W - M.r, py0 = H - M.b, py1 = M.t;

  function render(data) {
    var s = (data.series && data.series.line) || { points: [] };
    var pts = s.points || [];
    document.getElementById("title").textContent = (s.label || "STEPPED PULSE");

    var xs = OBS.scale(0, pts.length - 1 || 1, px0, px1);
    var ext = OBS.extent(pts, function (d) { return d.y; });
    var ys = OBS.scale(Math.min(0, ext[0]), ext[1] || 1, py0, py1);

    // horizontale Rasterlinien
    var ax = document.getElementById("axis");
    for (var k = 0; k <= 4; k++) {
      var gy = py1 + (py0 - py1) * k / 4;
      OBS.el("line", { class: "axis", x1: px0, y1: gy, x2: px1, y2: gy }, ax);
    }

    // Stufen-Pfad: erst horizontal (gleicher y), dann vertikal zum nächsten
    var d = "";
    pts.forEach(function (p, i) {
      var x = xs(i), y = ys(p.y);
      if (i === 0) { d += "M" + x + " " + y; }
      else { var xPrev = xs(i - 1); d += " L" + x + " " + ys(pts[i - 1].y) + " L" + x + " " + y; }
    });
    var line = document.getElementById("line");
    line.setAttribute("d", d);
    line.style.setProperty("--len", OBS.pathLen(line));

    // Marker an den Stufen-Spitzen
    var mk = document.getElementById("markers");
    pts.forEach(function (p, i) {
      var m = OBS.el("rect", { class: "hi-marker", x: xs(i) - 2, y: ys(p.y) - 2, width: 4, height: 4 }, mk);
      m.style.animationDelay = (0.8 + i * 0.1) + "s";
    });
  }
  OBS.loadData().then(render);
})();
</script>
</body>
</html>
