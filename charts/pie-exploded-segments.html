<!DOCTYPE html>
<!-- =====================================================================
     PIE 2 · "EXPLODED SEGMENTS"  (Kategorien aus labels, eine Reihe)
     Tortensegmente mit Abstand zur Mitte. Standard: erste Datenreihe,
     per ?dataset= wählbar. Einmalige pop-in Animation.
     ===================================================================== -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Pie · Exploded Segments</title>
<link rel="stylesheet" href="../shared/obs-core.css">
<style>
  .slice  { stroke: rgba(0,0,0,.35); stroke-width: 1; opacity: 0;
            animation: pop calc(.8s / var(--speed)) ease-out forwards; }
  @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
  .slabel { fill: var(--c-text); font-size: 10px; text-anchor: middle; }
</style>
</head>
<body>
  <div class="obs-module">
    <div class="tech-frame"><span class="corner-tr"></span><span class="corner-bl"></span></div>
    <div class="module-title" id="title">EXPLODED SEGMENTS</div>
    <svg class="viz" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet">
      <g id="pie" transform="translate(200,130)"></g>
    </svg>
    <div class="module-sub" id="sub">PIE</div>
  </div>

<script src="../shared/obs-core.js"></script>
<script>
(function () {
  var R = 88, EXPLODE = 12;
  var PAL = ["var(--c-primary)", "var(--c-accent)", "var(--c-text)"];

  function pickSeries(sheet) {
    var q = new URLSearchParams(location.search), want = q.get("dataset");
    if (want) { for (var i = 0; i < sheet.series.length; i++) if (sheet.series[i].name === want) return sheet.series[i]; }
    return sheet.series[0] || { name: "", values: [] };
  }
  function arcPath(r, a0, a1) {
    var p0 = OBS.polar(0, 0, r, a0), p1 = OBS.polar(0, 0, r, a1);
    var large = (a1 - a0) > 180 ? 1 : 0;
    return "M0 0 L" + p0.x + " " + p0.y + " A" + r + " " + r + " 0 " + large + " 1 " + p1.x + " " + p1.y + " Z";
  }

  function render(sheet) {
    document.getElementById("title").textContent = sheet.name || "EXPLODED SEGMENTS";
    var se = pickSeries(sheet), vals = se.values, labels = sheet.labels;
    var total = vals.reduce(function (a, b) { return a + b; }, 0) || 1;
    var pie = document.getElementById("pie"), ang = 0;

    vals.forEach(function (v, i) {
      var sweep = v / total * 360, a0 = ang, a1 = ang + sweep, mid = (a0 + a1) / 2;
      var push = OBS.polar(0, 0, EXPLODE, mid);
      var path = OBS.el("path", {
        class: "slice", d: arcPath(R, a0, a1), fill: PAL[i % PAL.length],
        transform: "translate(" + push.x + "," + push.y + ")"
      }, pie);
      path.style.fillOpacity = 0.45 + 0.5 * (1 - (i % PAL.length) / PAL.length);
      path.style.animationDelay = (i * 0.1) + "s";

      var lp = OBS.polar(push.x, push.y, R + 18, mid);
      OBS.el("text", { class: "slabel", x: lp.x, y: lp.y + 4 }, pie).textContent =
        (labels[i] || "") + " " + Math.round(v / total * 100) + "%";
      ang = a1;
    });
  }
  OBS.loadData().then(function (data) { render(OBS.normalizeSheet(data)); });
})();
</script>
</body>
</html>
