<!DOCTYPE html>
<!-- =====================================================================
     SCATTER 2 · "SIGNAL MATRIX"  (Multi-Serien, Pixel-Look)
     Werte (X = Label-Index, Y = Wert) auf ein Raster gequantelt und als
     "Pixel" dargestellt. Jede Datenreihe in eigener Farbe. Einblenden.
     ===================================================================== -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Scatter · Signal Matrix</title>
<link rel="stylesheet" href="../shared/obs-core.css">
<style>
  .grid line { stroke: var(--c-grid); stroke-width: 1; }
  .pix { opacity: 0; animation: fade-in calc(.4s / var(--speed)) ease forwards;
         filter: drop-shadow(0 0 calc(var(--glow) * .6) var(--c-accent)); }
  .lg-txt { fill: var(--c-text); font-size: 10px; }
</style>
</head>
<body>
  <div class="obs-module">
    <div class="tech-frame"><span class="corner-tr"></span><span class="corner-bl"></span></div>
    <div class="module-title" id="title">SIGNAL MATRIX</div>
    <svg class="viz" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet">
      <g class="grid" id="grid"></g>
      <g id="pixels"></g>
      <g id="legend"></g>
    </svg>
    <div class="module-sub" id="sub">SCATTER</div>
  </div>

<script src="../shared/obs-core.js"></script>
<script>
(function () {
  var M = { l: 26, r: 18, t: 26, b: 24 }, W = 400, H = 260;
  var px0 = M.l, px1 = W - M.r, py0 = H - M.b, py1 = M.t;
  var COLS = 22, ROWS = 14;

  function render(sheet) {
    document.getElementById("title").textContent = sheet.name || "SIGNAL MATRIX";
    var n = sheet.labels.length || 1;
    var cw = (px1 - px0) / COLS, ch = (py0 - py1) / ROWS;

    var grid = document.getElementById("grid");
    for (var c = 0; c <= COLS; c++) OBS.el("line", { x1: px0 + c * cw, y1: py1, x2: px0 + c * cw, y2: py0 }, grid);
    for (var r = 0; r <= ROWS; r++) OBS.el("line", { x1: px0, y1: py1 + r * ch, x2: px1, y2: py1 + r * ch }, grid);

    var lo = Math.min(0, sheet.min), hi = sheet.max || 1;
    var xs = OBS.scale(0, n - 1, 0, COLS - 1);
    var ys = OBS.scale(lo, hi, ROWS - 1, 0);

    var g = document.getElementById("pixels"), lg = document.getElementById("legend"), pi = 0;
    sheet.series.forEach(function (se, si) {
      var st = OBS.seriesStyle(si);
      se.values.forEach(function (v, i) {
        var col = Math.round(xs(i)), row = Math.round(ys(v));
        var rect = OBS.el("rect", {
          class: "pix", x: px0 + col * cw + 1.5, y: py1 + row * ch + 1.5,
          width: cw - 3, height: ch - 3, rx: 1, fill: st.color, opacity: st.opacity
        }, g);
        rect.style.animationDelay = (pi++ * 0.03) + "s";
      });
      OBS.el("rect", { x: px1 - 70, y: py1 - 14 + si * 13, width: 9, height: 9, rx: 2, fill: st.color, opacity: st.opacity }, lg);
      OBS.el("text", { class: "lg-txt", x: px1 - 57, y: py1 - 6 + si * 13 }, lg).textContent = se.name;
    });
  }
  OBS.loadData().then(function (data) { render(OBS.normalizeSheet(data)); });
})();
</script>
</body>
</html>
