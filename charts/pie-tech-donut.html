<!DOCTYPE html>
<!-- =====================================================================
     PIE 1 · "TECH DONUT"  (Kategorien aus labels, Werte aus einer Reihe)
     Kreisdiagramme zeigen EINE Datenreihe (Standard: erste; per
     ?dataset=Var 2 wählbar). Jede Kategorie = ein Segment. Zentralwert =
     Summe. Segmente wachsen einmalig ein.
     ===================================================================== -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Pie · Tech Donut</title>
<link rel="stylesheet" href="../shared/obs-core.css">
<style>
  .seg { fill: none; stroke-width: 26px; stroke-dasharray: 0 1000;
         animation: grow calc(1.2s / var(--speed)) ease-out forwards; }
  @keyframes grow { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
  .center-val { font-size: 38px; font-weight: 700; text-anchor: middle; fill: var(--c-text); }
  .center-lbl { font-size: 12px; text-anchor: middle; fill: var(--c-accent); letter-spacing: 2px; }
  .legend text { fill: var(--c-text); font-size: 10px; }
</style>
</head>
<body>
  <div class="obs-module">
    <div class="tech-frame"><span class="corner-tr"></span><span class="corner-bl"></span></div>
    <div class="module-title" id="title">TECH DONUT</div>
    <svg class="viz" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet">
      <g id="ring" transform="translate(130,130)"></g>
      <text class="center-val" id="cval" x="130" y="128">0</text>
      <text class="center-lbl" id="clbl" x="130" y="150">TOTAL</text>
      <g class="legend" id="legend"></g>
    </svg>
    <div class="module-sub" id="sub">PIE</div>
  </div>

<script src="../shared/obs-core.js"></script>
<script>
(function () {
  var R = 80, C = 2 * Math.PI * R;
  var PAL = ["var(--c-primary)", "var(--c-accent)", "var(--c-text)"];

  // eine Datenreihe wählen (?dataset= oder erste)
  function pickSeries(sheet) {
    var q = new URLSearchParams(location.search), want = q.get("dataset");
    if (want) { for (var i = 0; i < sheet.series.length; i++) if (sheet.series[i].name === want) return sheet.series[i]; }
    return sheet.series[0] || { name: "", values: [] };
  }

  function render(sheet) {
    document.getElementById("title").textContent = sheet.name || "TECH DONUT";
    var se = pickSeries(sheet);
    var labels = sheet.labels, vals = se.values;
    var total = vals.reduce(function (a, b) { return a + b; }, 0) || 1;

    var ring = document.getElementById("ring"), legend = document.getElementById("legend");
    var offset = 0;
    vals.forEach(function (v, i) {
      var frac = v / total;
      var c = OBS.el("circle", {
        class: "seg", r: R, cx: 0, cy: 0, stroke: PAL[i % PAL.length],
        "stroke-dasharray": (C * frac) + " " + C, transform: "rotate(" + (offset * 360 - 90) + ")"
      }, ring);
      c.style.opacity = 0.45 + 0.55 * (1 - (i % PAL.length) / PAL.length);
      c.style.setProperty("--len", C * frac);
      c.style.animationDelay = (i * 0.15) + "s";
      offset += frac;

      var ly = 54 + i * 20;
      OBS.el("rect", { x: 285, y: ly - 9, width: 10, height: 10, rx: 2, fill: PAL[i % PAL.length] }, legend);
      OBS.el("text", { x: 301, y: ly }, legend).textContent =
        (labels[i] || ("#" + (i + 1))) + "  " + Math.round(frac * 100) + "%";
    });

    var t0 = null, dur = 1000;
    function step(ts) { if (!t0) t0 = ts; var k = Math.min(1, (ts - t0) / dur);
      var e = 1 - Math.pow(1 - k, 3);
      document.getElementById("cval").textContent = Math.round(total * e);
      if (k < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  OBS.loadData().then(function (data) { render(OBS.normalizeSheet(data)); });
})();
</script>
</body>
</html>
