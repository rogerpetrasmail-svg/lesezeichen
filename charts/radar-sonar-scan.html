<!DOCTYPE html>
<!-- =====================================================================
     RADAR 2 · "SONAR SCAN"  (Multi-Serien)
     Konzentrische Kreise + rotierender Sonar-Strahl. Pro Datenreihe ein
     Polygon in Serienfarbe. Gemeinsame Skala. Polygone faden einmalig ein,
     nur der dezente Sweep läuft weiter (an --speed gekoppelt).
     ===================================================================== -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Radar · Sonar Scan</title>
<link rel="stylesheet" href="../shared/obs-core.css">
<style>
  .ring  { stroke: var(--c-grid); stroke-width: 1; fill: none; }
  .spoke { stroke: var(--c-grid); stroke-width: 1; }
  .data  { stroke-width: var(--line-width); fill-opacity: .16;
           opacity: 0; animation: fade-in calc(1s / var(--speed)) ease forwards; }
  .alabel { fill: var(--c-text); font-size: 10px; text-anchor: middle; }
  .lg-txt { fill: var(--c-text); font-size: 10px; }
  .sweep { transform-origin: 200px 130px; animation: sweep calc(5s / var(--speed)) linear infinite; }
  @keyframes sweep { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="obs-module">
    <div class="tech-frame"><span class="corner-tr"></span><span class="corner-bl"></span></div>
    <div class="module-title" id="title">SONAR SCAN</div>
    <svg class="viz" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="sonarGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g id="rings"></g>
      <path class="sweep" d="M200 130 L200 38 A92 92 0 0 1 282 96 Z" fill="url(#sonarGrad)"/>
      <g id="polys"></g>
      <g id="labels"></g>
      <g id="legend"></g>
    </svg>
    <div class="module-sub" id="sub">RADAR</div>
  </div>

<script src="../shared/obs-core.js"></script>
<script>
(function () {
  var CX = 200, CY = 130, R = 92;

  function render(sheet) {
    document.getElementById("title").textContent = sheet.name || "SONAR SCAN";
    var labels = sheet.labels, n = labels.length || 3;
    var max = sheet.max || 1;
    function ang(i) { return i / n * 360; }

    var rings = document.getElementById("rings");
    [0.25, 0.5, 0.75, 1].forEach(function (f) { OBS.el("circle", { class: "ring", cx: CX, cy: CY, r: R * f }, rings); });
    var lab = document.getElementById("labels");
    for (var i = 0; i < n; i++) {
      var v = OBS.polar(CX, CY, R, ang(i));
      OBS.el("line", { class: "spoke", x1: CX, y1: CY, x2: v.x, y2: v.y }, rings);
      var lp = OBS.polar(CX, CY, R + 15, ang(i));
      OBS.el("text", { class: "alabel", x: lp.x, y: lp.y + 4 }, lab).textContent = labels[i] || ("A" + i);
    }

    var polys = document.getElementById("polys"), lg = document.getElementById("legend");
    sheet.series.forEach(function (se, si) {
      var st = OBS.seriesStyle(si);
      var pts = [];
      for (var j = 0; j < n; j++) {
        var r = R * ((se.values[j] || 0) / max);
        var p = OBS.polar(CX, CY, r, ang(j));
        pts.push(p.x + "," + p.y);
      }
      var poly = OBS.el("polygon", { class: "data", points: pts.join(" "),
        stroke: st.color, fill: st.color, opacity: st.opacity,
        "stroke-dasharray": st.dash === "none" ? "" : st.dash }, polys);
      poly.style.animationDelay = (0.3 + si * 0.18) + "s";

      OBS.el("rect", { x: 14, y: 20 + si * 13, width: 9, height: 9, rx: 2, fill: st.color, opacity: st.opacity }, lg);
      OBS.el("text", { class: "lg-txt", x: 27, y: 28 + si * 13 }, lg).textContent = se.name;
    });
  }
  OBS.loadData().then(function (data) { render(OBS.normalizeSheet(data)); });
})();
</script>
</body>
</html>
